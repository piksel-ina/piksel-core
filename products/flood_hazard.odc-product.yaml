# Flood hazard for Indonesia (Bahaya Banjir 2025).
# One product per return period (option 2). Derived from a Modified Geomorphic
# Flood Index over FABDEM v1.2 with BMKG design rainfall. Single 2025 epoch.
# Measurements are identical across products; only return_period differs.
---
name: flood_hazard_rp02
description: Flood hazard (Bahaya Banjir 2025) - 1-in-2-year return period (50% AEP).
metadata_type: eo3
metadata:
  product:
    name: flood_hazard_rp02
  properties:
    return_period: 2
storage:
  crs: EPSG:6933
  resolution:
    x: 30
    y: -30
measurements:
  - name: flood_depth
    aliases: [depth]
    units: metre
    dtype: float32
    nodata: .nan
  - name: flood_hazard_index
    aliases: [index, hazard_index]
    units: "1"
    dtype: float32
    nodata: .nan
  - name: flood_hazard_class
    aliases: [classified, hazard_class]
    units: "1"
    dtype: uint8
    nodata: 255
    flags_definition:
      hazard:
        description: Flood hazard class
        bits: [0, 1, 2, 3, 4, 5, 6, 7]
        values:
          1: low
          2: moderate
          3: high
